        {% set warnings = {'events_inside_windows': '@@what_if_warning_events_inside_windows@@', 'prices_legacy_unverified': '@@what_if_warning_prices_legacy_unverified@@', 'invalid_input_entries_left_out': '@@what_if_warning_invalid_input_entries_left_out@@', 'public_charge_without_drive': '@@what_if_warning_public_charge_without_drive@@', 'many_connections_without_drive': '@@what_if_warning_many_connections_without_drive@@', 'prices_dst_hour_copied': '@@what_if_warning_prices_dst_hour_copied@@', 'connections_before_drive_history_left_out': '@@what_if_warning_connections_before_drive_history_left_out@@', 'prices_estimated_windows': '@@what_if_warning_prices_estimated_windows@@', 'start_level_unknown_calibrated': '@@what_if_warning_start_level_unknown_calibrated@@', 'prices_from_price_history': '@@what_if_warning_prices_from_price_history@@', 'connections_estimated_from_battery_statistics': '@@what_if_warning_connections_estimated_from_battery_statistics@@', 'older_connections_not_validated': '@@what_if_warning_older_connections_not_validated@@', 'estimated_connections_without_prices_left_out': '@@what_if_warning_estimated_connections_without_prices_left_out@@', 'connections_modelled_from_work_plan': '@@what_if_warning_connections_modelled_from_work_plan@@', 'work_plan_model_not_validated': '@@what_if_warning_work_plan_model_not_validated@@'} %}
        {% set notes = {'hindsight': '@@what_if_note_hindsight@@', 'modelled_policy': '@@what_if_note_modelled_policy@@', 'demand_from_recorded_drives': '@@what_if_note_demand_from_recorded_drives@@', 'settings_history_not_stored': '@@what_if_note_settings_history_not_stored@@', 'last_connection_left_out': '@@what_if_note_last_connection_left_out@@', 'extra_top_ups_not_modelled': '@@what_if_note_extra_top_ups_not_modelled@@', 'forced_low_battery_charging_not_modelled': '@@what_if_note_forced_low_battery_charging_not_modelled@@', 'site_limits_not_replayed': '@@what_if_note_site_limits_not_replayed@@', 'solar_not_modelled': '@@what_if_note_solar_not_modelled@@', 'grid_buy_price_only': '@@what_if_note_grid_buy_price_only@@', 'standby_not_modelled': '@@what_if_note_standby_not_modelled@@'} %}
