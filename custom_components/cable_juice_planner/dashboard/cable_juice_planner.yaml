- type: sections
  path: what-if
  title: '@@view_what_if@@'
  icon: mdi:flask-outline
  max_columns: 4
  dense_section_placement: true
  sections:
  # Scenario A: daily smart charging to the maximum recommended level (engine/whatif)
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: '@@what_if_a_title@@'
      icon: mdi:battery-charging-high
    - type: markdown
      content: "<details><summary>@@read_more@@</summary>\n\n@@what_if_a_explain@@\n\n</details>"
      grid_options: *id001
    - type: entities
      show_header_toggle: false
      entities:
      - entity: number.cjp_what_if_days
        name:
          type: entity
      - entity: number.cjp_what_if_target_battery_level
        name:
          type: entity
      - entity: number.cjp_what_if_start_battery_level
        name:
          type: entity
      - entity: select.cjp_what_if_day_selection
        name:
          type: entity
      - entity: switch.cjp_what_if_day_monday
        name:
          type: entity
      - entity: switch.cjp_what_if_day_tuesday
        name:
          type: entity
      - entity: switch.cjp_what_if_day_wednesday
        name:
          type: entity
      - entity: switch.cjp_what_if_day_thursday
        name:
          type: entity
      - entity: switch.cjp_what_if_day_friday
        name:
          type: entity
      - entity: switch.cjp_what_if_day_saturday
        name:
          type: entity
      - entity: switch.cjp_what_if_day_sunday
        name:
          type: entity
      - entity: button.cjp_run_what_if
        name:
          type: entity
      grid_options: *id001
    - type: markdown
      card_mod:
        style:
          .: |
            ha-card {
              --markdown-table-border-color: transparent
            }
          ha-markdown$: |
            table, th, td {
              border: none !important;
            }
            table {
              border-collapse: collapse;
            }
            table tbody tr:not(:only-child):nth-child(odd) td {
              background: rgba(127, 127, 127, 0.08);
            }
      content: |-
        {% set a = states.sensor.cjp_what_if.attributes %}
        {% set r = a.result %}
        {% set at = a.attempt %}
        {% set reasons = {'no_battery_capacity': '@@what_if_reason_no_battery_capacity@@', 'no_charging_power': '@@what_if_reason_no_charging_power@@', 'no_start_soc': '@@what_if_reason_no_start_soc@@', 'invalid_target': '@@what_if_reason_invalid_target@@', 'no_windows': '@@what_if_reason_no_windows@@', 'invalid_window': '@@what_if_reason_invalid_window@@', 'overlapping_windows': '@@what_if_reason_overlapping_windows@@', 'prices_not_hourly': '@@what_if_reason_prices_not_hourly@@', 'invalid_event': '@@what_if_reason_invalid_event@@', 'invalid_loss_model': '@@what_if_reason_invalid_loss_model@@', 'invalid_power_model': '@@what_if_reason_invalid_power_model@@', 'energy_conservation': '@@what_if_reason_energy_conservation@@', 'missing_prices': '@@what_if_reason_missing_prices@@', 'public_overfill': '@@what_if_reason_public_overfill@@', 'invalid_day_selection': '@@what_if_reason_invalid_day_selection@@', 'interrupted': '@@what_if_reason_interrupted@@', 'internal_error': '@@what_if_reason_internal_error@@', 'no_drives': '@@what_if_reason_no_drives@@', 'no_days_selected': '@@what_if_reason_no_days_selected@@', 'start_level_stale': '@@what_if_reason_start_level_stale@@', 'unmet_target_differs': '@@what_if_reason_unmet_target_differs@@', 'unmet_driving_differs': '@@what_if_reason_unmet_driving_differs@@', 'no_prices': '@@what_if_reason_no_prices@@'} %}
        {% set warnings = {'events_inside_windows': '@@what_if_warning_events_inside_windows@@', 'prices_legacy_unverified': '@@what_if_warning_prices_legacy_unverified@@', 'invalid_input_entries_left_out': '@@what_if_warning_invalid_input_entries_left_out@@', 'public_charge_without_drive': '@@what_if_warning_public_charge_without_drive@@', 'many_connections_without_drive': '@@what_if_warning_many_connections_without_drive@@', 'prices_dst_hour_copied': '@@what_if_warning_prices_dst_hour_copied@@', 'connections_before_drive_history_left_out': '@@what_if_warning_connections_before_drive_history_left_out@@', 'prices_estimated_windows': '@@what_if_warning_prices_estimated_windows@@', 'start_level_unknown_calibrated': '@@what_if_warning_start_level_unknown_calibrated@@', 'prices_from_price_history': '@@what_if_warning_prices_from_price_history@@', 'connections_estimated_from_battery_statistics': '@@what_if_warning_connections_estimated_from_battery_statistics@@', 'older_connections_not_validated': '@@what_if_warning_older_connections_not_validated@@', 'estimated_connections_without_prices_left_out': '@@what_if_warning_estimated_connections_without_prices_left_out@@', 'connections_modelled_from_work_plan': '@@what_if_warning_connections_modelled_from_work_plan@@', 'work_plan_model_not_validated': '@@what_if_warning_work_plan_model_not_validated@@'} %}
        {% set notes = {'hindsight': '@@what_if_note_hindsight@@', 'site_limits_not_replayed': '@@what_if_note_site_limits_not_replayed@@', 'solar_not_modelled': '@@what_if_note_solar_not_modelled@@', 'grid_buy_price_only': '@@what_if_note_grid_buy_price_only@@', 'standby_not_modelled': '@@what_if_note_standby_not_modelled@@', 'departure_buffer_not_modelled': '@@what_if_note_departure_buffer_not_modelled@@'} %}
        {% set sources = {'entered': '@@what_if_source_entered@@', 'recorded_state': '@@what_if_source_recorded_state@@', 'statistics_hour_mean': '@@what_if_source_statistics_hour_mean@@', 'battery_statistics': '@@what_if_source_battery_statistics@@', 'unavailable': '@@what_if_source_unavailable@@'} %}
        {% set day_selections = {'all': '@@what_if_day_selection_all@@', 'work_plan': '@@what_if_day_selection_work_plan@@', 'monday_friday': '@@what_if_day_selection_monday_friday@@', 'weekend': '@@what_if_day_selection_weekend@@', 'selected': '@@what_if_day_selection_selected@@'} %}
        {% if at and at.status == 'running' -%}
        <ha-alert alert-type="info">@@what_if_running@@</ha-alert>
        {%- elif at and at.status == 'unavailable' -%}
        <ha-alert alert-type="warning">@@what_if_failed@@: {{ reasons.get(at.reason, at.reason) }}</ha-alert>
        {%- endif %}
        {% if not r -%}
        <ha-alert alert-type="info">@@what_if_no_result@@</ha-alert>
        {%- else -%}
        {%- set d0 = (r.get('coverage') or {}).get('first_window') -%}{%- set d1 = (r.get('coverage') or {}).get('last_window') -%}
        **@@what_if_result_title@@** ({{ r.computed_at | timestamp_custom('%Y-%m-%d %H:%M', true) }}): {{ r.period.start | timestamp_custom('%Y-%m-%d', true) }} &ndash; {{ r.period.end | timestamp_custom('%Y-%m-%d', true) }} ({{ r.period.days }} @@what_if_days_unit@@) &middot; {% if d0 and d1 %}@@what_if_data_span@@ {{ d0 | timestamp_custom('%Y-%m-%d', true) }} &ndash; {{ d1 | timestamp_custom('%Y-%m-%d', true) }} ({{ ((d1 - d0) / 86400) | round(0) | int }} @@what_if_days_unit@@){% endif %} &middot; @@what_if_target@@ {{ r.target.battery_level | round(0) }} % &middot; @@what_if_start_soc@@ {{ '' if r.calibrated_start else (r.smart.start_soc ~ ' % ') }}({{ sources.get(r.provenance.start_soc, r.provenance.start_soc) }})

        {% if r.status == 'partial' -%}
        <ha-alert alert-type="warning">@@what_if_partial@@ {{ r.windows.stopped_at | timestamp_custom('%Y-%m-%d %H:%M', true) }}: {{ reasons.get(r.reason, r.reason) }} ({{ r.windows.replayed }} / {{ r.windows.total }} @@what_if_connections@@)</ha-alert>
        {%- endif %}
        {% if not r.comparable -%}
        <ha-alert alert-type="warning">@@what_if_not_comparable@@ {{ reasons.get(r.comparable_reason, r.comparable_reason) }}</ha-alert>
        {%- endif %}
        {% set d = r.difference %}
        {% set c = r.get('current') %}
        {% set cs = r.get('settings') %}
        {% set sm = c.get('same') if c else none %}
        | | @@what_if_b_col_current@@ | @@what_if_col_smart@@ | @@what_if_col_immediate@@ | @@what_if_col_smart_vs_current@@ | @@what_if_col_immediate_vs_current@@ |
        |:---|---:|---:|---:|---:|---:|
