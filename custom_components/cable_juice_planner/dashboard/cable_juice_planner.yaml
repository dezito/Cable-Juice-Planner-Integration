                // ------------------------------------------
                // TODAY
                // ------------------------------------------

                const today =
                  hass.states[
                    'sensor.stromligning_15min_spotprice_ex_vat'
                  ]?.attributes?.prices || [];

                today.forEach(p => {
                  const spotprice = Number(p.price);

                  if (Number.isFinite(spotprice)) {
                    data.push([
                      new Date(p.start),
                      spotprice - sellCosts
                    ]);
                  }
                });


                // ------------------------------------------
                // I MORGEN
                // ------------------------------------------

                const tomorrowEntity =
                  hass.states[
                    'binary_sensor.stromligning_15min_tomorrow_available_ex_vat'
                  ];

                const tomorrowPrices =
                  tomorrowEntity?.attributes?.prices || [];

                tomorrowPrices.forEach(p => {
                  const spotprice = Number(p.price);

                  if (Number.isFinite(spotprice)) {
                    data.push([
                      new Date(p.start),
                      spotprice - sellCosts
                    ]);
                  }
                });


                // ------------------------------------------
                // LAST PRICE FROM THE TOMORROW ENTITY
                // ------------------------------------------

                let availableEnd = 0;

                [...today, ...tomorrowPrices].forEach(p => {
                  const end =
                    new Date(p.end).getTime();

                  if (
                    !isNaN(end) &&
