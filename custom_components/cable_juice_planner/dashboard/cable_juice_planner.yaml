# The Cable Juice Planner dashboard, written for the prefix cjp and the author's car,
# charger, price and solar entities; management/dashboard_build.py rewrites it per instance and removes
# the cards of entities that do not exist (no car, no solar, ...).
# @@key@@ = dashboard.key of texts/<language>.json. Built by a script, edit with care.
views:
- type: sections
  path: overview
  title: '@@view_overview@@'
  max_columns: 4
  dense_section_placement: true
  badges:
  - type: custom:mushroom-template-badge
    content: '@@debug_info@@'
    icon: mdi:mushroom
    color: yellow
    tap_action:
      action: perform-action
      perform_action: cable_juice_planner.debug_info
      data:
        config_entry_id: __ENTRY_ID__
    label: ''
    visibility:
    - condition: state
      entity: input_boolean.dezito_show_debug_button
      state: 'on'
  - &id002
    type: entity
    entity: button.cjp_enforce_planning
    name: '@@enforce_planning@@'
    show_name: false
    show_state: true
    show_icon: true
    state_content: name
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.cjp_enforce_planning
  sections:
  - type: grid
    cards:
    - type: custom:apexcharts-card
      graph_span: 7d
      span:
        start: hour
        offset: -6h
      experimental:
        brush: true
      brush:
        selection_span: 7d
      header:
        show: true
        title: '@@battery_chart_title@@'
        show_states: false
      now:
        show: true
        label: '@@now@@'
      yaxis:
      - id: level
        min: 0
        max: 100
        decimals: 0
      - id: charge
        min: 0
        opposite: true
        decimals: 1
      - id: distance
        min: 0
        opposite: true
        decimals: 0
      apex_config:
        tooltip:
          shared: true
          intersect: false
          followCursor: true
          fixed:
            enabled: false
          x:
            show: true
            format: ddd dd/MM HH:mm
        dataLabels:
          enabled: false
      series:
      - entity: sensor.cjp_current_charging_rule
        name: '@@distance_per_day@@'
        yaxis_id: distance
        type: area
        unit: '@@distance@@'
        color: '#FF9800'
        opacity: 0.15
        stroke_width: 2
        curve: stepline
        extend_to: false
        float_precision: 0
        data_generator: |
          const flow = entity.attributes.battery_forecast || [];
          const drives = entity.attributes.distance_forecast || [];
          return flow.map(p => {
            const time = new Date(p.time).getTime();
            const km = drives
              .filter(d => time >= new Date(d.time).getTime() && time < new Date(d.end).getTime())
              .reduce((sum, d) => sum + Number(d.km), 0);
            return [time, km];
          });
        show:
          in_brush: true
          legend_value: false
      - entity: sensor.cjp_current_charging_rule
        name: '@@battery_forecast@@'
        yaxis_id: level
        type: area
        color: '#4CAF50'
        opacity: 0.25
        stroke_width: 2
        curve: straight
        data_generator: |
          const flow = entity.attributes.battery_forecast || [];
          return flow.map(p => [new Date(p.time).getTime(), Number(p.battery_level)]);
        show:
          in_brush: true
          legend_value: false
      - entity: sensor.cjp_current_charging_rule
        yaxis_id: charge
        type: area
        name: '@@planned_charging@@'
        unit: kWh
        color: '#2196F3'
        opacity: 0.6
        stroke_width: 1
        curve: stepline
        extend_to: false
        float_precision: 2
        data_generator: |
          const flow = entity.attributes.battery_forecast || [];
          const plan = entity.attributes.charge_plan || [];
          return flow.map(point => {
            const time = new Date(point.time).getTime();
            const charging = plan.find(p => {
              const start = new Date(p.time).getTime();
              const end = p.end ? new Date(p.end).getTime() : start + 3600000;
              return time >= start && time < end;
            });
            return [time, charging ? Number(charging.kwh) : 0];
          });
        show:
          in_brush: true
          legend_value: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.energi_data_service
          state: unavailable
        card:
          type: horizontal-stack
          cards:
          - type: markdown
            content: '# Energi Data Service @@is_down@@ <font color=red>!!!</font>'
          - show_name: true
            show_icon: true
            type: button
            entity: sensor.energi_data_service
            tap_action:
              action: call-service
              service: homeassistant.reload_config_entry
              target:
                entity_id: sensor.energi_data_service
            hold_action:
              action: none
            icon: mdi:reload
            name: '@@restart@@ Energi Data Service'
            show_state: true
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.energi_data_service
          state_not: unavailable
        card:
          type: custom:config-template-card
          variables:
            today_prices: |
              states['sensor.energi_data_service'].attributes.today || []
            tomorrow_prices: |
              states['sensor.energi_data_service'].attributes.tomorrow || []
            forecast_prices: |
              if (states['sensor.energi_data_service'].attributes.forecast) {
                states['sensor.energi_data_service'].attributes.forecast.map(item =>
                item.price)
              } else { []}
            total_hours: |
              const allPrices = [...vars.today_prices, ...vars.tomorrow_prices, ...vars.forecast_prices]; allPrices.length
            lowest_price: |
              let min = 999; const allPrices = [...vars.today_prices, ...vars.tomorrow_prices, ...vars.forecast_prices]; allPrices.forEach(price => {
                if (price < min) min = price;
              }); min * 1.05
            highest_price: |
              let max = -999; const allPrices = [...vars.today_prices, ...vars.tomorrow_prices, ...vars.forecast_prices]; allPrices.forEach(price => {
                if (price > max) max = price;
              }); max * 0.95
            mean_price: |
              let sum = 0.0; const allPrices = [...vars.today_prices, ...vars.tomorrow_prices, ...vars.forecast_prices]; allPrices.forEach(price => {
                sum += price;
              }); const mean = sum / vars.total_hours; mean
            step_under_mean: |
              (vars.mean_price - vars.lowest_price) / 5
            step_over_mean: |
              (vars.highest_price - vars.mean_price) / 5
            price1: vars.lowest_price
            price2: vars.mean_price - vars.step_under_mean * 4
            price3: vars.mean_price - vars.step_under_mean * 3
            price4: vars.mean_price - vars.step_under_mean * 2
            price5: vars.mean_price - vars.step_under_mean * 1
            price6: vars.mean_price
            price7: vars.mean_price + vars.step_over_mean * 1
            price8: vars.mean_price + vars.step_over_mean * 2
            price9: vars.mean_price + vars.step_over_mean * 3
            price10: vars.mean_price + vars.step_over_mean * 4
            price11: vars.highest_price
            total_span: 24 * 7 - 1
          entities: []
          card:
            type: custom:apexcharts-card
            apex_config:
              chart:
                height: 300px
              xaxis:
                tooltip:
                  enabled: false
              tooltip:
                shared: true
                intersect: false
                followCursor: true
                fixed:
                  enabled: false
                x:
                  show: true
                enabledOnSeries:
                - 0
                - 1
                - 2
                - 4
                custom: |
                  EVAL:function({ series, dataPointIndex, w }) {
                    const indices = [0, 1, 2, 4];
                    const xValues = w.globals.seriesX[0] || [];
                    const time = xValues[dataPointIndex];
                    const title = Number.isFinite(time)
                      ? new Date(time).toLocaleString(undefined, {
                          weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                        })
                      : '';
                    const rows = indices.map(index => {
                      const values = series[index] || [];
                      const value = values[dataPointIndex];
                      const valid = value !== null && value !== undefined && Number.isFinite(Number(value));
                      const suffix = index < 2 ? ' @@valuta@@' : ' kWh';
                      const shown = valid ? Number(value).toFixed(2) + suffix : '-';
                      const color = w.globals.colors[index] || '#888';
                      const name = w.globals.seriesNames[index] || '';
                      return '<div style="display:flex;align-items:center;gap:8px;padding:3px 10px;">' +
                        '<span style="width:10px;height:10px;border-radius:50%;background:' + color + ';"></span>' +
                        '<span>' + name + ':</span><strong style="margin-left:auto;">' + shown + '</strong></div>';
                    }).join('');
                    return '<div class="apexcharts-tooltip-title" style="padding:6px 10px;">' + title + '</div>' + rows;
                  }
              stroke:
                curve: straight
              markers:
                size: 0
            all_series_config:
              unit: kWh
              extend_to: false
              fill_raw: zero
              show:
                legend_value: false
                offset_in_name: false
            experimental:
              color_threshold: true
              brush: true
            brush:
              selection_span: ${total_span + "h"}
            header:
              title: ${"@@price_chart_title@@ 🔵" + vars.lowest_price.toFixed(2) + " 🟢" + vars.mean_price.toFixed(2) + " 🟣" + vars.highest_price.toFixed(2)}
              show: true
              standard_format: false
              show_states: false
              colorize_states: true
            now:
              show: true
              label: '@@now@@'
            graph_span: ${total_span +"h"}
            span:
              start: day
            yaxis:
            - id: price
            - id: solar
              opposite: true
              decimals: 1
              max: ~6.0
              min: 0
            - id: charge
              min: 0
              opposite: true
              show: false
            show:
              loading: true
              last_updated: true
            series:
            - entity: sensor.energi_data_service
              yaxis_id: price
              type: column
              name: '@@incl_taxes@@'
              unit: '@@valuta@@'
              color: green
              data_generator: |
                const buy = entity.attributes || {};
                const sell = hass.states['sensor.energi_data_service_salg']?.attributes || {};
                const buyRows = [...(buy.raw_today || []), ...(buy.forecast || []), ...(buy.tomorrow_valid ? buy.raw_tomorrow || [] : [])];
                const sellRows = [...(sell.raw_today || []), ...(sell.forecast || []), ...(sell.tomorrow_valid ? sell.raw_tomorrow || [] : [])];
                const values = new Map(buyRows.map(row => [new Date(row.hour).getTime(), Number(row.price)]));
                const hourKey = value => { const d = new Date(value); d.setMinutes(0, 0, 0); return d.getTime(); };
                const hourlyValues = new Map(buyRows.map(row => [hourKey(row.hour), Number(row.price)]));
                const times = [...new Set([...buyRows, ...sellRows].map(row => new Date(row.hour).getTime()).filter(Number.isFinite))].sort((a, b) => a - b);
                return times.map(time => {
                  const value = values.has(time) ? values.get(time) : hourlyValues.get(hourKey(time));
                  return [time, Number.isFinite(value) ? value : null];
                });
              float_precision: 2
              group_by:
                func: avg
                duration: 15min
              color_threshold:
              - value: ${vars.price1}
                color: '#0064FF'
              - value: ${vars.price2}
                color: '#0096FF'
              - value: ${vars.price3}
                color: '#00B496'
              - value: ${vars.price4}
                color: '#00FA50'
              - value: ${vars.price5}
                color: '#00FF32'
              - value: ${vars.price6}
                color: '#00FF00'
              - value: ${vars.price7}
                color: '#FFFF00'
              - value: ${vars.price8}
                color: '#FFA500'
              - value: ${vars.price9}
                color: '#FF5000'
              - value: ${vars.price10}
                color: '#C81919'
              - value: ${vars.price11}
                color: '#C800C8'
              opacity: 0.75
              show:
                in_brush: true
            - entity: sensor.energi_data_service
              yaxis_id: price
              type: area
              name: '@@sell_price@@'
              unit: '@@valuta@@'
              color: white
              stroke_width: 0
              data_generator: |
                const sell = hass.states['sensor.energi_data_service_salg']?.attributes || {};
                const buy = hass.states['sensor.energi_data_service']?.attributes || {};
                const buyRows = [...(buy.raw_today || []), ...(buy.forecast || []), ...(buy.tomorrow_valid ? buy.raw_tomorrow || [] : [])];
                const sellRows = [...(sell.raw_today || []), ...(sell.forecast || []), ...(sell.tomorrow_valid ? sell.raw_tomorrow || [] : [])];
                const values = new Map(sellRows.map(row => [new Date(row.hour).getTime(), Number(row.price)]));
                const times = [...new Set([...buyRows, ...sellRows].map(row => new Date(row.hour).getTime()).filter(Number.isFinite))].sort((a, b) => a - b);
                return times.map(time => [time, values.has(time) && Number.isFinite(values.get(time)) ? values.get(time) : null]);
              float_precision: 2
              group_by:
                func: avg
                duration: 15min
              opacity: 0.75
              show:
                in_brush: true
            - entity: sensor.energi_data_service
              yaxis_id: solar
              type: area
              name: '@@solar_forecast@@'
              data_generator: |
                const hourKey = value => { const d = new Date(value); d.setMinutes(0, 0, 0); return d.getTime(); };
                const buy = hass.states['sensor.energi_data_service']?.attributes || {};
                const sell = hass.states['sensor.energi_data_service_salg']?.attributes || {};
                const buyRows = [...(buy.raw_today || []), ...(buy.forecast || []), ...(buy.tomorrow_valid ? buy.raw_tomorrow || [] : [])];
                const sellRows = [...(sell.raw_today || []), ...(sell.forecast || []), ...(sell.tomorrow_valid ? sell.raw_tomorrow || [] : [])];
                const times = [...new Set([...buyRows, ...sellRows].map(row => new Date(row.hour).getTime()).filter(Number.isFinite))].sort((a, b) => a - b);
                const solarByHour = new Map();
                const overlay = (series) => {
                  (series || []).forEach(row => {
                    const value = Number(row.pv_estimate);
                    if (Number.isFinite(value)) solarByHour.set(hourKey(row.period_start), value);
                  });
                };

                overlay(hass.states['sensor.solcast_pv_forecast_forecast_today']?.attributes?.detailedHourly || []); overlay(hass.states['sensor.solcast_pv_forecast_forecast_tomorrow']?.attributes?.detailedHourly || []); overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_3']?.attributes?.detailedHourly || []); overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_4']?.attributes?.detailedHourly || []); overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_5']?.attributes?.detailedHourly || []); overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_6']?.attributes?.detailedHourly || []); overlay(hass.states['sensor.solcast_pv_forecast_forecast_day_7']?.attributes?.detailedHourly || []);
                return times.map(time => [time, solarByHour.get(hourKey(time)) || 0]);
              color: orange
              stroke_width: 0
              opacity: 0.5
              group_by:
                func: avg
                duration: 15min
              show:
                in_brush: true
            - entity: sensor.energi_data_service
              yaxis_id: price
              type: area
              name: '@@forecast@@'
              unit: ''
              stroke_width: 0
              opacity: 0.25
              color: purple
              data_generator: "try {\n  var eds = (entity && entity.attributes) ? entity.attributes : {};\n  //if (eds.tomorrow_valid) return [];\n\n  // Start: the first forecast hour (most accurate)\n  var start = null;\n  if (eds.forecast && eds.forecast.length && eds.forecast[0] && eds.forecast[0].hour) {\n    start = new Date(eds.forecast[0].hour).getTime();\n  }\n  \n  // Fallback: tomorrow 00:00 local time\n  if (!start || isNaN(start)) {\n    var now = new Date();\n    start = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0).getTime();\n  }\n  \n  \n  // Use the same rows as the ones plotted\n  var rows = [];\n  if (eds.raw_today) rows = rows.concat(eds.raw_today);\n  if (eds.forecast) rows = rows.concat(eds.forecast);\n  if (eds.raw_tomorrow) rows = rows.concat(eds.raw_tomorrow);\n\n  // Max price to fill \"the full height\"\n  var maxP = 0;\n  for (var i = 0; i < rows.length; i++) {\n    var p = Number(rows[i] && rows[i].price);\n    if (!isNaN(p) &&\
                \ p > maxP) maxP = p;\n  }\n  if (maxP <= 0) maxP = 10;\n\n  // Unique times, sorted\n  var map = {};\n  for (var j = 0; j < rows.length; j++) {\n    var h = rows[j] && rows[j].hour;\n    if (!h) continue;\n    var t = new Date(h).getTime();\n    if (isNaN(t)) continue;\n    map[t] = 1;\n  }\n  var times = Object.keys(map).map(function(x){ return Number(x); }).sort(function(a,b){ return a-b; });\n\n  // Fail-safe: without times, make 2 points so the card doesn't hang\n  if (!times.length) {\n    return [\n      [new Date(start), maxP],\n      [new Date(start + 3600000), maxP]\n    ];\n  }\n\n  // 0 before the start, max after it => fills the rest\n  var out = [];\n  for (var k = 0; k < times.length; k++) {\n    var tt = times[k];\n    out.push([new Date(tt), (tt >= start) ? maxP : 0]);\n  }\n  return out;\n\n} catch (e) {\n  console.log(\"forecast_zone error\", e);\n  return [];\n}\n"
              group_by:
                func: avg
                duration: 15min
              show:
                in_brush: false
                legend_value: false
            - entity: sensor.cjp_current_charging_rule
              yaxis_id: charge
              type: area
              name: '@@planned_charging@@'
              unit: kWh
              color: '#2196F3'
              opacity: 0.6
              stroke_width: 1
              curve: stepline
              extend_to: false
              float_precision: 2
              data_generator: |
                const plan = entity.attributes.charge_plan || [];
                const buy = hass.states['sensor.energi_data_service']?.attributes || {};
                const sell = hass.states['sensor.energi_data_service_salg']?.attributes || {};
                const buyRows = [...(buy.raw_today || []), ...(buy.forecast || []), ...(buy.tomorrow_valid ? buy.raw_tomorrow || [] : [])];
                const sellRows = [...(sell.raw_today || []), ...(sell.forecast || []), ...(sell.tomorrow_valid ? sell.raw_tomorrow || [] : [])];
                const times = [...new Set([...buyRows, ...sellRows].map(row => new Date(row.hour).getTime()).filter(Number.isFinite))].sort((a, b) => a - b);
                return times.map(time => {
                  const charging = plan.find(p => {
                    const start = new Date(p.time).getTime();
                    const end = p.end ? new Date(p.end).getTime() : start + 3600000;
                    return time >= start && time < end;
                  });
                  return [time, charging ? Number(charging.kwh) : 0];
                });
              show:
                in_brush: true
                legend_value: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.stromligning_current_price_vat
          state: unavailable
        card:
          type: horizontal-stack
          cards:
          - type: markdown
            content: '# Strømligning @@is_down@@ <font color=red>!!!</font>'
          - show_name: true
            show_icon: true
            type: button
            entity: sensor.stromligning_current_price_vat
            tap_action:
              action: call-service
              service: homeassistant.reload_config_entry
              target:
                entity_id: sensor.stromligning_current_price_vat
            hold_action:
              action: none
            icon: mdi:reload
            name: '@@restart@@ Strømligning'
            show_state: true
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.stromligning_current_price_vat
          state_not: unavailable
        card:
          type: custom:config-template-card
          variables:
            today_prices: |
              states['sensor.stromligning_current_price_vat']
                ?.attributes?.prices || []
            tomorrow_prices: |
              (() => {
                const entity =
                  states['binary_sensor.stromligning_tomorrow_available_vat'];

                return entity?.attributes?.prices || [];
              })()
            forecast_prices: |
              states['sensor.stromligning_forecasts_vat']
                ?.attributes?.prices || []
            all_prices: |
              (() => {
                const today =
                  states['sensor.stromligning_current_price_vat']
                    ?.attributes?.prices || [];

                const tomorrowEntity =
                  states['binary_sensor.stromligning_tomorrow_available_vat'];

                const tomorrow =
                  tomorrowEntity?.attributes?.prices || [];

                const tomorrowIsForecast =
                  tomorrowEntity?.attributes?.forecast_data === true;

                const officialTomorrow =
                  tomorrowIsForecast ? [] : tomorrow;

                const official = [
                  ...today,
                  ...officialTomorrow
                ];

                let officialEnd = 0;

                official.forEach(p => {
                  const end = new Date(p.end).getTime();

                  if (!isNaN(end) && end > officialEnd)
                    officialEnd = end;
                });

                const forecast =
                  states['sensor.stromligning_forecasts_vat']
                    ?.attributes?.prices || [];

                const prices = [
                  ...today,
                  ...tomorrow
                ]
                  .map(p => Number(p.price))
                  .filter(Number.isFinite);

                let forecastEnd = 0;

                tomorrow.forEach(p => {
                  const end = new Date(p.end).getTime();

                  if (!isNaN(end) && end > forecastEnd)
                    forecastEnd = end;
                });

                const existingEnd =
                  Math.max(officialEnd, forecastEnd);

                forecast.forEach(p => {
                  const start = new Date(p.start).getTime();
                  const price = Number(p.price);

                  if (
                    start >= existingEnd &&
                    Number.isFinite(price)
                  ) {
                    prices.push(price);
                  }
                });

                return prices;
              })()
            total_hours: |
              vars.all_prices.length
            lowest_price: |
              (() => {
                if (!vars.all_prices.length)
                  return 0;

                return Math.min(...vars.all_prices) * 1.05;
              })()
            highest_price: |
              (() => {
                if (!vars.all_prices.length)
                  return 0;

                return Math.max(...vars.all_prices) * 0.95;
              })()
            mean_price: |
              (() => {
                if (!vars.all_prices.length)
                  return 0;

                return vars.all_prices.reduce(
                  (sum, price) => sum + price,
                  0
                ) / vars.all_prices.length;
              })()
            step_under_mean: |
              (vars.mean_price - vars.lowest_price) / 5
            step_over_mean: |
              (vars.highest_price - vars.mean_price) / 5
            price1: vars.lowest_price
            price2: vars.mean_price - vars.step_under_mean * 4
            price3: vars.mean_price - vars.step_under_mean * 3
            price4: vars.mean_price - vars.step_under_mean * 2
            price5: vars.mean_price - vars.step_under_mean
            price6: vars.mean_price
            price7: vars.mean_price + vars.step_over_mean
            price8: vars.mean_price + vars.step_over_mean * 2
            price9: vars.mean_price + vars.step_over_mean * 3
            price10: vars.mean_price + vars.step_over_mean * 4
            price11: vars.highest_price
            total_span: 24 * 7 - 1
          entities:
          - sensor.stromligning_current_price_vat
          - binary_sensor.stromligning_tomorrow_available_vat
          - sensor.stromligning_forecasts_vat
          - sensor.stromligning_15min_spotprice_ex_vat
          - binary_sensor.stromligning_15min_tomorrow_available_ex_vat
          - sensor.stromligning_15min_forecasts_ex_vat
          - sensor.stromligning_nettariff_vat
          - sensor.stromligning_systemtariff_vat
          - sensor.solcast_pv_forecast_forecast_today
          - sensor.solcast_pv_forecast_forecast_tomorrow
          - sensor.solcast_pv_forecast_forecast_day_3
          - sensor.solcast_pv_forecast_forecast_day_4
          - sensor.solcast_pv_forecast_forecast_day_5
