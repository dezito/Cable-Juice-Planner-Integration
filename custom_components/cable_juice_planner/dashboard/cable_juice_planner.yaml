        show_states: false
      graph_span: 1095d
      span:
        end: month
      now:
        show: false
      yaxis:
      - decimals: 3
      all_series_config:
        type: line
        unit: ' kWh/%'
        float_precision: 3
        stroke_width: 2
        show:
          legend_value: false
          in_header: false
      apex_config:
        tooltip:
          shared: true
          intersect: false
