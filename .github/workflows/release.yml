name: Release

# Builds custom_components/<domain> into <domain>.zip and attaches it to the
# release. hacs.json has zip_release, so HACS installs from this asset and the
# release page shows its download count.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the zip to (e.g. v1.0.8)
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      DOMAIN: cable_juice_planner
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check manifest version
        run: |
          version=$(jq -r .version "custom_components/$DOMAIN/manifest.json")
          if [ "v$version" != "$TAG" ] && [ "$version" != "$TAG" ]; then
            echo "::warning::Tag $TAG does not match manifest version $version"
          fi

      - name: Build zip
        run: |
          cd "custom_components/$DOMAIN"
          zip -r -X "$GITHUB_WORKSPACE/$DOMAIN.zip" . -x '*__pycache__*' '*.pyc'
          unzip -l "$GITHUB_WORKSPACE/$DOMAIN.zip" | tail -n 1

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$DOMAIN.zip" --clobber --repo "$GITHUB_REPOSITORY"
